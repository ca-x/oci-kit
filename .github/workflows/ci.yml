name: Validate toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable doc --locked --workspace --no-deps
      - run: cargo +stable build --locked --release --workspace --bins
      - run: rustfmt +stable --edition 2024 --check tests/fixtures/pacman-key.rs
      - run: bash -n scripts/check-static.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test --locked --workspace

  static-runtime:
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y musl-tools bubblewrap
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: cargo +stable test --locked --release --workspace --target x86_64-unknown-linux-musl
      - run: bash scripts/check-static.sh target/x86_64-unknown-linux-musl/release
      - run: rustc +stable --edition 2024 --target x86_64-unknown-linux-musl -C linker=musl-gcc tests/fixtures/pacman-key.rs -o target/pacman-key-fixture
      - run: sudo python3 scripts/test-init-runtime.py --binary target/x86_64-unknown-linux-musl/release/lighos-init --pacman-key-fixture target/pacman-key-fixture --runner chroot
